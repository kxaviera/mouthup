# Replace DOMAIN before use (default: mouthup.app)
# api.${DOMAIN}  -> NestJS API + WebSocket + uploads
# admin.${DOMAIN} -> Next.js admin panel
# app.${DOMAIN}  -> Flutter web static files

upstream mouthup_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream mouthup_admin {
    server 127.0.0.1:3001;
    keepalive 16;
}

# API
server {
    listen 80;
    listen [::]:80;
    server_name api.DOMAIN;

    client_max_body_size 50M;

    location / {
        proxy_pass http://mouthup_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (realtime DMs + notifications)
    location /socket.io/ {
        proxy_pass http://mouthup_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /uploads/ {
        proxy_pass http://mouthup_api;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# Admin panel
server {
    listen 80;
    listen [::]:80;
    server_name admin.DOMAIN;

    location / {
        proxy_pass http://mouthup_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Flutter web app
server {
    listen 80;
    listen [::]:80;
    server_name app.DOMAIN;

    root /var/www/mouthup-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
