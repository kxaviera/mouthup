# Nginx proxies on Traefik's Docker network → PM2 on host (host.docker.internal).
# Used by deploy/vps-traefik-routes.sh — do not run manually unless debugging.

services:
  mouthup-api-proxy:
    image: nginx:alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.mouthup-api.rule=Host(`api.DOMAIN`)
      - traefik.http.routers.mouthup-api.entrypoints=websecure
      - traefik.http.routers.mouthup-api.tls.certresolver=letsencrypt
      - traefik.http.services.mouthup-api.loadbalancer.server.port=80

  mouthup-admin-proxy:
    image: nginx:alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.mouthup-admin.rule=Host(`admin.DOMAIN`)
      - traefik.http.routers.mouthup-admin.entrypoints=websecure
      - traefik.http.routers.mouthup-admin.tls.certresolver=letsencrypt
      - traefik.http.services.mouthup-admin.loadbalancer.server.port=80

  mouthup-app-proxy:
    image: nginx:alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx-app.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.mouthup-app.rule=Host(`app.DOMAIN`)
      - traefik.http.routers.mouthup-app.entrypoints=websecure
      - traefik.http.routers.mouthup-app.tls.certresolver=letsencrypt
      - traefik.http.services.mouthup-app.loadbalancer.server.port=80

networks:
  traefik:
    external: true
    name: TRAEFIK_NETWORK
